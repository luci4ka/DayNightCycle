# ═══════════════════════════════════════════
#   DayNightCycle — 简体中文 (TerraCraft Style)
# ═══════════════════════════════════════════

# ─── 通用 ───
prefix: "<gradient:#FFC107:#FFC107><bold>DayNightCycle</bold></gradient> <#1B5E20>»"

# ─── AFK (action bar) ───
afk.enabled: "<#FFA726>AFK"
afk.disabled: "<#8BC34A>恢复活跃"
afk.disabled.system: "<#FFA726>AFK 系统已禁用。"
afk.manual.toggle: "<#B0BEC5>AFK: <#FFFFFF>%state%"
afk.state.on: "<#8BC34A>开启"
afk.state.off: "<#FFA726>关闭"

# ─── 睡眠 ───
sleep.skip: "<#FFA726>夜晚已跳过！ <#B0BEC5>(<#FFFFFF>%sleeping%<#B0BEC5>/<#FFFFFF>%required%<#B0BEC5> 已入睡)"
sleep.animation.start: "<#FFA726>夜晚正在加速..."

# ─── 循环 ───
cycle.set.success: "<#8BC34A>循环已更新：<#FFFFFF>白天 %day% 分钟<#8BC34A>，<#FFFFFF>夜晚 %night% 分钟"

# ─── 命令: reload ───
command.reload.success: "<#8BC34A>配置已重新加载。"
command.reload.error: "<#FFA726>重新加载错误：<#FFFFFF>%error%"
command.reload.error.console: "<#FFA726>重新加载失败。请查看控制台。"

# ─── 命令: status ───
command.status.header: "<gradient:#FFC107:#FFC107>▬▬▬▬▬ <bold>DayNightCycle</bold> ▬▬▬▬▬</gradient>"
command.status.day: "<#B0BEC5>白天：<#FFFFFF>%day% <#B0BEC5>分钟"
command.status.night: "<#B0BEC5>夜晚：<#FFFFFF>%night% <#B0BEC5>分钟"
command.status.afk-timeout: "<#B0BEC5>AFK 超时：<#FFFFFF>%timeout% <#B0BEC5>分钟"
command.status.afk-players: "<#B0BEC5>当前 AFK：<#FFA726>%count%"
command.status.footer: "<gradient:#FFC107:#FFC107>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</gradient>"

# ─── 命令: info ───
command.info.header: "<gradient:#8BC34A:#8BC34A>▬▬▬▬▬ <bold>DayNightCycle</bold> ▬▬▬▬▬</gradient>"
command.info.version: "<#B0BEC5>版本：<#FFFFFF>%version%"
command.info.author: "<#B0BEC5>作者：<#FFFFFF>%author%"
command.info.languages: "<#B0BEC5>语言：<#FFFFFF>%languages%"
command.info.papi: "<#B0BEC5>PlaceholderAPI：%state%"
command.info.bstats: "<#B0BEC5>bStats：%state%"
command.info.footer: "<gradient:#8BC34A:#8BC34A>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</gradient>"

# ─── 命令: time ───
command.time.header: "<gradient:#FFC107:#FFC107>▶ <bold>世界时间</bold> ◀</gradient>"
command.time.world: "<#B0BEC5>▶ <gray>世界：<#FFFFFF>%world%"
command.time.day: "<#B0BEC5>▶ <gray>时间：<#FFFFFF>%time% <#B0BEC5>(<#FFFFFF>%ticks% <#B0BEC5>刻)"
command.time.footer: "<gradient:#FFC107:#FFC107>▶ ▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬ ◀</gradient>"

# ─── Time: 世界 ───
command.time.world.overworld: "<#8BC34A>主世界"
command.time.world.nether: "<#FFA726>下界"
command.time.world.end: "<#AB47BC>末地"
command.time.world.other: "<#B0BEC5>%world%"

# ─── 状态 ───
state.enabled: "<#8BC34A>已启用"
state.disabled: "<#FFA726>已禁用"

# ─── Sleep override ───
sleeplist.header: "<#B0BEC5>睡眠覆盖列表 (<#FFFFFF>%count%<#B0BEC5>)："
sleeplist.entry: "<#B0BEC5> • <#FFFFFF>%player%"
sleeplist.added: "<#8BC34A>玩家 <#FFFFFF>%player%<#8BC34A> 已添加到覆盖列表。"
sleeplist.removed: "<#8BC34A>玩家 <#FFFFFF>%player%<#8BC34A> 已从覆盖列表移除。"
sleeplist.not-found: "<#FFA726>玩家 <#FFFFFF>%player%<#FFA726> 未在列表中找到。"
sleeplist.invalid-name: "<#FFA726>无效的玩家名：<#FFFFFF>%player%"

# ─── 错误 ───
error.no-permission: "<#FFA726>权限不足。"
error.unknown: "<#FFA726>未知错误：<#FFFFFF>%error%"