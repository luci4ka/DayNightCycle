plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.2'
}

group = 'ru.terracraft'
version = '1.0.2'

repositories {

    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://raw.githubusercontent.com/CarmJos/MineSQL/repo/' }
    maven { url = 'https://repo.carm.cc/repository/maven-public/' }
    maven { url = 'https://repo.codemc.org/repository/maven-public/' }
}

dependencies {
    // ==================== PAPER ====================
    compileOnly 'io.papermc.paper:paper-api:26.2.build.+'

    compileOnly("dev.jorel:commandapi-paper-core:12.1.0")
    compileOnly 'me.clip:placeholderapi:2.12.3'

    implementation 'de.exlll:configlib-paper:4.8.1'
    implementation('com.github.ez-plugins:mc-plugin-update-notifier:1.0.0')
    implementation 'org.bstats:bstats-bukkit:3.2.1'
}

shadowJar {
    archiveClassifier.set('')

    relocate 'org.bstats', 'ru.terracraft.daynightcycle.libs.bstats'
    relocate 'de.exlll.configlib', 'ru.terracraft.daynightcycle.libs.configlib'
    relocate 'com.github.ezplugins', 'ru.terracraft.daynightcycle.libs.updater'

    exclude 'org/yaml/snakeyaml/**'
    exclude 'META-INF/versions/**'
    exclude 'META-INF/maven/**'
    exclude 'module-info.class'

    mergeServiceFiles()
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}